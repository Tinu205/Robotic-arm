controller_manager:
  ros__parameters:
    # 1000 Hz (= Gazebo's 1 ms physics step). At 100 Hz the D gains needed for the
    # shoulder make the light base-yaw joint unstable (see gains comments below).
    update_rate: 1000
    use_sim_time: true 

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster 
    
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController 

    effort_controller:
      type: effort_controllers/JointGroupEffortController


joint_trajectory_controller:
  ros__parameters:
    joints:
      - base_yaw_joint
      - shoulder_joint
      - elbow_joint 
    command_interfaces:
      - effort

    state_interfaces:
      - velocity
      - position


    gains:
      
      base_yaw_joint: {p: 50.0, i: 0.0, d: 5.0}
     
      shoulder_joint: {p: 500.0, i: 100.0, d: 8.0}
     
      elbow_joint: {p: 100.0, i: 0.0, d: 5.0}

effort_controller:
  ros__parameters:
    joints:
      - base_yaw_joint
      - shoulder_joint
      - elbow_joint
